<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Password Reset Request</h2>
    <p>Hi {{ user.first_name }},</p>
    <p>You requested a password reset for your Medica account.</p>
    <p>
        <a href="{{ reset_url }}" style="display: inline-block; padding: 12px 24px; background-color: #1976d2; color: white; text-decoration: none; border-radius: 4px;">
            Reset Password
        </a>
    </p>
    <p>Or copy and paste this link in your browser:</p>
    <p>{{ reset_url }}</p>
    <p>This link expires in 24 hours.</p>
    <p>If you did not request this, please ignore this email.</p>
    <br>
    <p>— Medica Team</p>
</body>
</html>
