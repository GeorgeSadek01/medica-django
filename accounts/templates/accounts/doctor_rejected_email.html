<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Documents Update Needed</h2>
    <p>Hi Dr. {{ user.first_name }},</p>
    <p>Unfortunately, your verification documents could not be approved.</p>
    {% if reason %}
    <p><strong>Reason:</strong> {{ reason }}</p>
    {% endif %}
    <p>Please upload corrected documents to proceed with verification.</p>
    <p>
        <a href="{{ resubmit_url }}" style="display: inline-block; padding: 12px 24px; background-color: #1976d2; color: white; text-decoration: none; border-radius: 4px;">
            Upload Documents
        </a>
    </p>
    <br>
    <p>— Medica Team</p>
</body>
</html>
